; 青空收藏菜单 skyui like v1n
; 所有位置和尺寸均使用 SWF 1280x720 逻辑坐标。
; 颜色来源：0=跟随游戏 HUD，1=预设配色。

[General]
bMascotEnabled=1 ; 是否显示右上角辐射娘
iThemeColorMode=0
iThemeColorPreset=0 ; 预设配色：0=避难所绿，1=琥珀终端，2=冰霜青，3=废土锈红，4=兰紫，5=冷白终端
iIconMode=2 ; 图标来源：0=仅 FIS，1=自绘，2=FIS 优先并回退自绘
bShowItemInnerName=0 ; 显示武器/装备名称中 | 后面的改造标识：0=隐藏，1=显示
iAllSortMode=0 ; 全部分类排序：0=名称，1=使用频率
fSlowMotionScale=0.0 ; 菜单时间倍率：0=时停，0.5=半速，1=正常
iDPadUpAction=1 ; 手柄十字键上：0=禁用，1=打开收藏菜单
iDPadDownAction=1 ; 手柄十字键下：0=禁用，1=打开收藏菜单
iDPadLeftAction=1 ; 手柄十字键左：0=禁用，1=打开收藏菜单
iDPadRightAction=1 ; 手柄十字键右：0=禁用，1=打开收藏菜单

[Layout]
; 当前仅保留 16:9 基准；实际分辨率和比例由 SWF 根容器自动适配。
; 打开菜单期间实时重读布局，调完后建议改回 0。
bLayoutEditorMode=1 ; 是否实时重读布局：1=开启，0=关闭
fLayoutRefreshSeconds=0.50 ; 实时重读间隔，单位为秒

[SkyuiLike16x9]
