; AozoraFavorites Ultimate Edition
; 青空收藏菜单 - 终极版
; EN: Layout values use SWF 1280x720 logical coordinates; runtime scaling handles resolution and aspect ratio.
; 中文：布局数值使用 SWF 1280x720 逻辑坐标；运行时自动适配分辨率和比例。
; EN: Theme color source: 0 = follow HUD, 1 = use preset.
; 中文：主题颜色来源：0=跟随游戏 HUD，1=使用预设配色。

[General]
bMascotEnabled=1 ; EN: Show mascot | 中文：是否显示右上角辐射娘
iThemeColorMode=0 ; EN: Theme color source | 中文：界面颜色来源
iThemeColorPreset=0 ; EN: Theme preset | 中文：预设配色：0=避难所绿，1=琥珀终端，2=冰霜青，3=废土锈红，4=兰紫，5=冷白终端
iIconMode=2 ; EN: Icon source mode | 中文：图标来源：0=仅 FIS，1=自绘，2=FIS 优先并回退自绘
bShowItemInnerName=0 ; EN: Show weapon or armor suffix | 中文：显示武器/装备名称中 | 后面的改造标识：0=隐藏，1=显示
iAllSortMode=0 ; EN: All-category sort mode | 中文：全部分类排序：0=名称，1=使用频率
iLogLevel=2 ; EN: Log level | 中文：日志等级：0=Error，1=Warning，2=Info，3=Debug
fSlowMotionScale=0.0 ; EN: Menu time scale | 中文：菜单时间倍率：0=时停，0.5=半速，1=正常
iDPadUpAction=1 ; EN: D-pad up action | 中文：手柄十字键上：0=放行原版逻辑，1=打开青空收藏（旧值2按原版逻辑迁移）
iDPadDownAction=1 ; EN: D-pad down action | 中文：手柄十字键下：0=放行原版逻辑，1=打开青空收藏（旧值2按原版逻辑迁移）
iDPadLeftAction=1 ; EN: D-pad left action | 中文：手柄十字键左：0=放行原版逻辑，1=打开青空收藏（旧值2按原版逻辑迁移）
iDPadRightAction=1 ; EN: D-pad right action | 中文：手柄十字键右：0=放行原版逻辑，1=打开青空收藏（旧值2按原版逻辑迁移）

[Layout]
